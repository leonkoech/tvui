<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  /* Instrument Sans, self-hosted; woff for the TV's 2014 browser, woff2 for newer ones. */
  @font-face { font-family: "Instrument Sans"; font-weight: 400; src: url(/instrument-sans-400.woff2) format("woff2"), url(/instrument-sans-400.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url(/instrument-sans-500.woff2) format("woff2"), url(/instrument-sans-500.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url(/instrument-sans-600.woff2) format("woff2"), url(/instrument-sans-600.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 700; src: url(/instrument-sans-700.woff2) format("woff2"), url(/instrument-sans-700.woff) format("woff"); }

  /* Sized in rem; the script scales 1rem to the screen (16px at 1280 wide). */
  /* One pre-composited image: pastel wash plus plum scrims. No CSS gradients or full-screen
     translucent layers, which the TV's 2014 browser renders as blocky tiles. */
  html, body { margin: 0; height: 100%; color: #fff; overflow: hidden;
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: none; }
  body { background-color: #e9cfd8; background-image: url(/bg.jpg); background-position: center;
    background-repeat: no-repeat; -webkit-background-size: cover; background-size: cover; }

  .top { position: absolute; left: 2.5rem; right: 2.5rem; top: 1.6rem; font-size: 1.1rem;
    color: rgba(255,255,255,.72); text-shadow: 0 .1rem .8rem rgba(40,10,50,.6); }
  .top .date { float: right; }

  .side { position: absolute; left: 1.6rem; top: 11rem; width: 2.6rem; }
  .side div { width: 2.6rem; height: 2.6rem; margin-bottom: 1.4rem; border-radius: 1rem;
    text-align: center; background: rgba(255,255,255,.14); }
  .side div.cur:after { content: ""; display: block; width: 1.2rem; height: .16rem;
    margin: .55rem auto 0; background: #F6D6E1; border-radius: .1rem; }
  .side div.on { background: #fff; }
  .side div.on svg { stroke: #5b2a6e; }
  .side svg { width: 1.4rem; height: 1.4rem; margin-top: .6rem; }

  .hero { position: absolute; left: 6.5rem; top: 10rem; width: 34rem; text-shadow: 0 .1rem .8rem rgba(40,10,50,.55); }
  .hero h1 { margin: 0; font-size: 3.2rem; font-weight: 600; letter-spacing: -.05rem; }
  .hero p { margin: .7rem 0 1.4rem; font-size: 1.05rem; line-height: 1.5; color: rgba(255,255,255,.75); }
  .hero .btn { display: inline-block; padding: .6rem 1.3rem; border-radius: .4rem;
    background: #fff; color: #111; font-size: 1rem; font-weight: 600; }

  .shelf { position: absolute; left: 6.5rem; bottom: 12.6rem; font-size: 1.35rem; font-weight: 500;
    color: rgba(255,255,255,.85); }
  .row { position: absolute; left: 6.5rem; right: 0; bottom: 2.4rem; height: 8.6rem; white-space: nowrap;
    -webkit-transition: margin-left .2s; transition: margin-left .2s; }
  .cell { display: inline-block; vertical-align: top; width: 11rem; margin-right: 1.2rem; text-align: center; }
  .tile { width: 11rem; height: 6.24rem; border-radius: .7rem; overflow: hidden;
    line-height: 6.24rem; font-size: 1.6rem; font-weight: 700; letter-spacing: -.03rem;
    background-size: cover; background-position: center; opacity: .82;
    -webkit-transition: -webkit-transform .18s, opacity .18s; transition: transform .18s, opacity .18s; }
  /* Focused: lift, plus a ring and glow in the app's own color (set in draw()) */
  .cell.on .tile { opacity: 1; -webkit-transform: scale(1.08); transform: scale(1.08); }
  .cap { margin-top: .9rem; font-size: .85rem; color: rgba(255,255,255,.75); visibility: hidden; }
  .cell.on .cap { visibility: visible; color: #fff; }

  .note { position: absolute; left: 6.5rem; bottom: 1.2rem; font-size: .9rem; color: rgba(255,255,255,.5); }
</style>
</head>
<body>

<div class="top"><span id="clock"></span><span class="date" id="date"></span></div>

<div class="side" id="side">
  <div class="cur" data-a="home"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
  <div data-a="menu"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg></div>
  <div data-a="off"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></div>
</div>

<div class="hero"><h1 id="title"></h1><p id="desc"></p><span class="btn">&#9654;&nbsp; Open</span></div>
<div class="shelf">Your apps</div>
<div class="row" id="row"></div>
<div class="note" id="note"></div>

<script>
// ES5 only: older Bravia web runtimes don't support modern JS.
(function () {
  document.documentElement.style.fontSize = (window.innerWidth / 1280 * 16) + "px";
})();

// Known services get their logo tile (img) or brand colors; anything else gets a neutral card.
// halo: the app's color (r,g,b), used in the focus glow.
var BRANDS = {
  netflix: { bg: "#000", fg: "#e50914", halo: "229,9,20", text: "NETFLIX", img: 1 },
  youtube: { bg: "#fff", fg: "#ff0000", halo: "255,60,60", text: "YouTube", img: 1 },
  prime:   { bg: "#1a98ff", fg: "#fff", halo: "26,152,255", text: "prime video", img: 1 },
  roku:    { bg: "#6c1d7d", fg: "#fff", halo: "170,70,200", text: "Roku", img: 1 },
  crunchyroll: { bg: "#f47521", fg: "#fff", halo: "244,117,33", text: "crunchyroll", img: 1 },
  laptop:  { bg: "#1b1b1f", fg: "#fff", halo: "41,168,255", text: "Laptop", img: 1 },
  hulu:    { bg: "#0b0c0f", fg: "#1ce783", halo: "28,231,131", text: "hulu" },
  disney:  { bg: "#0e1a5c", fg: "#fff", halo: "60,110,255", text: "Disney+" },
  plex:    { bg: "#1f1f1f", fg: "#e5a00d", halo: "229,160,13", text: "plex" },
  max:     { bg: "#002be7", fg: "#fff", halo: "40,90,255", text: "max" }
};
var DESC = {
  input: "Switch the TV to this HDMI input.",
  app: "Open the app on the TV.",
  key: "Open the app on the TV.",
  roku: "Opens on your Roku."
};

var tiles = [], sel = 0, inSide = false, sideSel = 0;
var row = document.getElementById("row"), note = document.getElementById("note");
var side = document.getElementById("side").getElementsByTagName("div");

function brand(name) {
  var k = name.toLowerCase();
  for (var b in BRANDS) if (k.indexOf(b) >= 0) { BRANDS[b].key = b; return BRANDS[b]; }
  return { bg: "#26262b", fg: "#fff", halo: "200,200,215", text: name };
}

function get(path, done) {
  var x = new XMLHttpRequest();
  x.open("GET", path, true);
  x.onreadystatechange = function () { if (x.readyState === 4 && done) done(x.status, x.responseText); };
  x.send();
}

function build() {
  for (var i = 0; i < tiles.length; i++) {
    var b = brand(tiles[i].name), c = document.createElement("div"), t = document.createElement("div"),
        cap = document.createElement("div");
    c.className = "cell";
    t.className = "tile";
    t.style.backgroundColor = b.bg;
    t.style.color = b.fg;
    if (b.img) t.style.backgroundImage = "url(/tile-" + b.key + ".png)";
    else t.innerHTML = b.text;
    cap.className = "cap";
    cap.innerHTML = tiles[i].name;
    c.appendChild(t);
    c.appendChild(cap);
    row.appendChild(c);
  }
  draw();
}

function draw() {
  var n = row.childNodes;
  for (var i = 0; i < n.length; i++) {
    var on = !inSide && i === sel, h = brand(tiles[i].name).halo, t = n[i].firstChild;
    n[i].className = "cell" + (on ? " on" : "");
    t.style.boxShadow = t.style.webkitBoxShadow = on
      ? "0 0 0 .22rem rgb(" + h + "), 0 0 1.6rem .4rem rgba(" + h + ",.65), 0 0 4rem 1.2rem rgba(" + h + ",.35)" : "none";
  }
  for (var j = 0; j < side.length; j++)
    side[j].className = (j === 0 ? "cur" : "") + (inSide && j === sideSel ? " on" : "");
  if (!tiles.length) return;
  var t = tiles[sel];
  document.getElementById("title").innerHTML = t.name;
  document.getElementById("desc").innerHTML = t.label || DESC[t.action] || "";
  // Scroll the row so the selected tile stays on screen (tile + gap = 12.2rem, ~6 fit).
  row.style.marginLeft = -Math.max(0, sel - 5) * 12.2 + "rem";
}

function launch() {
  if (inSide) {
    var a = side[sideSel].getAttribute("data-a");
    if (a === "menu") get("/api/key?name=Home");
    if (a === "off") get("/api/key?name=PowerOff");
    return;
  }
  var name = tiles[sel].name;
  note.innerHTML = "Opening " + name + "&hellip;";
  get("/api/tile?i=" + sel, function (status) {
    note.innerHTML = status === 200 ? "" : "Couldn't open " + name;
  });
}

document.onkeydown = function (e) {
  var k = e.keyCode, n = tiles.length;
  if (k === 13) { launch(); return false; }
  if (inSide) {
    if (k === 38) sideSel = Math.max(0, sideSel - 1);
    else if (k === 40) sideSel = Math.min(side.length - 1, sideSel + 1);
    else if (k === 39) inSide = false;
    else return true;
  } else {
    if (k === 37) { if (sel === 0) { inSide = true; sideSel = 0; } else sel--; }
    else if (k === 39) sel = Math.min(n - 1, sel + 1);
    else if (k !== 38 && k !== 40) return true;
  }
  draw();
  return false;
};

// The TV's own clock and timezone are often wrong, so show the server's local time:
// keep the gap between the two clocks and read the result as UTC fields.
var clockShift = null;

function syncClock() {
  get("/api/time", function (status, body) {
    if (status !== 200) return;
    var t = JSON.parse(body);
    clockShift = t.epoch_ms - new Date().getTime() + t.utc_offset_min * 60000;
    tick();
  });
}

function tick() {
  if (clockShift === null) return;  // don't show the TV's wrong time while waiting
  var d = new Date(new Date().getTime() + clockShift), h = d.getUTCHours(), m = d.getUTCMinutes();
  document.getElementById("clock").innerHTML =
    (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM");
  document.getElementById("date").innerHTML =
    ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()] + ", " +
    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()] + " " + d.getUTCDate();
}
syncClock(); setInterval(tick, 5000); setInterval(syncClock, 10 * 60000);

get("/api/tiles", function (status, body) {
  if (status === 200) { tiles = JSON.parse(body); build(); }
  else note.innerHTML = "Can't load tiles";
});
</script>
</body>
</html>
