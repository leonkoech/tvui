<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  /* Instrument Sans, self-hosted; woff for the TV's 2014 browser, woff2 for newer ones. */
  @font-face { font-family: "Instrument Sans"; font-weight: 400; src: url(/instrument-sans-400.woff2) format("woff2"), url(/instrument-sans-400.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url(/instrument-sans-500.woff2) format("woff2"), url(/instrument-sans-500.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url(/instrument-sans-600.woff2) format("woff2"), url(/instrument-sans-600.woff) format("woff"); }

  /* The screensaver's lettering: Cormorant Garamond for the names and numbers, Figtree for the rest. */
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: normal; src: url(/cormorant-garamond-600-normal.woff2) format("woff2"), url(/cormorant-garamond-600-normal.woff) format("woff"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url(/cormorant-garamond-500-italic.woff2) format("woff2"), url(/cormorant-garamond-500-italic.woff) format("woff"); }
  @font-face { font-family: "Figtree"; font-weight: 400; src: url(/figtree-400-normal.woff2) format("woff2"), url(/figtree-400-normal.woff) format("woff"); }
  @font-face { font-family: "Figtree"; font-weight: 600; src: url(/figtree-600-normal.woff2) format("woff2"), url(/figtree-600-normal.woff) format("woff"); }

  /* Sized in rem; the script scales 1rem to the screen (24px at 1920 wide).
     The TV's 2014 browser repaints the whole screen on every change, so everything here
     is cheap to draw: one pre-composited background (wash + plum scrims baked into
     bg.jpg), no gradients, blurs, opacity on images or animations, and tile images made
     at the exact size they're shown. */
  html, body { margin: 0; height: 100%; color: #fff; overflow: hidden;
    font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: none; }
  body { background: #4a2a52 url(/bg-cottage.jpg) no-repeat center; -webkit-background-size: cover; background-size: cover; }

  .top { position: absolute; left: 2.5rem; right: 2.5rem; top: 1.6rem; font-size: 1.1rem;
    color: rgba(255,255,255,.72); }
  .top .date { float: right; }

  /* Sidebar: bare icons. Dim at rest, the current page a little brighter, the focused
     one a white disc with a plum icon so it never turns white-on-white. */
  .side { position: absolute; left: 1.6rem; top: 9.4rem; width: 2.8rem; }
  .side div { width: 2.8rem; height: 2.8rem; margin-bottom: 1.2rem; border-radius: 1.4rem;
    text-align: center; opacity: .55; }
  .side div.cur { opacity: .9; }
  .side div.on { opacity: 1; background: #fff; }
  .side div.on svg { stroke: #5b2a6e; }
  .side svg { width: 1.4rem; height: 1.4rem; margin-top: .7rem; }

  .hero { position: absolute; left: 6.5rem; top: 8.6rem; width: 40rem; }
  .hero h1 { margin: 0; font-size: 3.2rem; font-weight: 600; letter-spacing: -.05rem; }
  .hero p { margin: .6rem 0 0; font-size: 1.1rem; color: rgba(255,255,255,.75); }

  .shelf { position: absolute; left: 6.5rem; top: 19.4rem; font-size: 1.3rem; font-weight: 500;
    color: rgba(255,255,255,.85); }

  /* Grid: 5 per row, scrolls down a row at a time once past two rows. */
  .view { position: absolute; left: 6.5rem; top: 21.8rem; width: 64rem; height: 18.9rem; overflow: hidden; }
  .grid { position: absolute; left: 0; top: .4rem; width: 64rem; }
  .cell { position: relative; float: left; width: 11rem; height: 9.3rem; margin: 0 1.2rem 0 .4rem; text-align: center; }
  .ring { position: absolute; left: -.28rem; top: -.28rem; width: 11.56rem; height: 6.81rem;
    border-radius: .95rem; visibility: hidden; }
  .tile { position: relative; width: 11rem; height: 6.25rem; border-radius: .7rem; overflow: hidden;
    line-height: 6.25rem; font-size: 1.6rem; font-weight: 600;
    background-repeat: no-repeat; -webkit-background-size: 100% 100%; background-size: 100% 100%; }
  .cap { margin-top: .75rem; font-size: .9rem; visibility: hidden; }
  .cell.on .ring, .cell.on .cap { visibility: visible; }

  /* Inputs panel: slides out from the sidebar (no animation; it just appears). */
  #panel { position: absolute; top: 4.6rem; bottom: 2.4rem; left: 5.4rem; width: 22rem; padding: 2.6rem 1.6rem 0;
    border-radius: 1.4rem;
    background: #3d0f48; display: none; }
  #panel.open { display: block; }
  .ph { font-size: .9rem; letter-spacing: .12rem; text-transform: uppercase; color: rgba(255,255,255,.6);
    margin-bottom: 1.4rem; }
  .pi { padding: .7rem; margin-bottom: .6rem; border-radius: 1rem; color: rgba(255,255,255,.75); overflow: hidden; }
  .pi.on { background: #fff; color: #5b2a6e; }
  .pt { float: left; width: 6rem; height: 3.4rem; border-radius: .6rem; margin-right: 1rem;
    background-repeat: no-repeat; -webkit-background-size: 100% 100%; background-size: 100% 100%; }
  .pi b { display: block; font-size: 1.25rem; font-weight: 600; margin-top: .25rem; }
  .pi span { display: block; font-size: .9rem; margin-top: .15rem; }

  /* Screensaver, "painted on the wall": after a few idle minutes, the plain cottage photo with
     the greeting, clock and weather lettered straight onto the plaster in leaf-green, with a
     soft white halo where petals reach in. It only redraws once a minute. */
  #saver { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; color: #23402f;
    font-family: "Figtree", "Helvetica Neue", Arial, sans-serif;
    background-color: #f6f3ee; background-image: url(/saver.jpg); background-repeat: no-repeat;
    background-position: center; -webkit-background-size: cover; background-size: cover; }
  #saver.on { display: block; }
  #saver .wall, #saver .wx { text-shadow: 0 0 .5rem rgba(255,255,255,.7); }
  /* Frosted panels are baked into saver.jpg (see make_saver.py); these boxes line up with them. */
  #saver .wall { position: absolute; left: 17.4rem; top: 12.4rem; width: 29rem; height: 21.4rem;
    padding: 2rem 2.4rem; -webkit-box-sizing: border-box; box-sizing: border-box; }
  #saver .hello, #saver .names, #saver .clock, #saver .wxt { font-family: "Cormorant Garamond", Georgia, serif; }
  /* Cormorant's numbers are old-style by default (the 4 drops below the line); use even-height ones. */
  #saver .clock, #saver .wxt { -webkit-font-feature-settings: "lnum" 1, "tnum" 1; font-feature-settings: "lnum" 1, "tnum" 1;
    font-variant-numeric: lining-nums tabular-nums; }

  #saver .hello { font-size: 1.9rem; font-style: italic; font-weight: 500; color: #3d5747; }
  #saver .names { font-size: 3.8rem; font-weight: 600; letter-spacing: -.02rem; line-height: .98; margin-top: .1rem; }
  #saver .names b { font-style: italic; font-weight: 500; color: #d2537f; }
  #saver .clock { font-size: 5.4rem; font-weight: 600; line-height: .95; margin-top: 1.2rem; white-space: nowrap; }
  #saver .day { font-size: 1.3rem; font-weight: 600; color: #3d5747; margin-top: .5rem; }
  #saver .wx { position: absolute; right: 15.6rem; top: 12.4rem; width: 16.4rem; height: 12.6rem; padding: 1.8rem 2.2rem;
    -webkit-box-sizing: border-box; box-sizing: border-box; text-align: right; visibility: hidden; }
  #saver .wx.ready { visibility: visible; }
  #saver .wxi { display: inline-block; width: 3.6rem; height: 3.6rem; vertical-align: middle; margin-right: .5rem; }
  #saver .wxt { display: inline-block; vertical-align: middle; font-size: 5.4rem; font-weight: 600; line-height: 1; }
  #saver .wxc { font-size: 1.35rem; font-weight: 600; margin-top: .3rem; }
  #saver .wxr { font-size: 1.1rem; color: #3d5747; margin-top: .2rem; }
  #saver .hint { position: absolute; left: 0; right: 0; bottom: 2.2rem; text-align: center; }
  #saver .hint span { display: inline-block; padding: 0 1.4rem; line-height: 2.6rem; border-radius: 1.3rem;
    font-size: 1.05rem; font-weight: 600; background: rgba(252,250,246,.9); color: #23402f; }

  .note { position: absolute; left: 6.5rem; bottom: 1.2rem; font-size: .9rem; color: rgba(255,255,255,.6); }
</style>
</head>
<body>

<div class="top"><span id="clock"></span><span class="date" id="date"></span></div>

<div class="side" id="side">
  <div class="cur" data-a="home"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
  <div data-a="inputs"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13M12 7l5 5-5 5M21 4v16"/></svg></div>
  <div data-a="menu"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg></div>
  <div data-a="wallpaper"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg></div>
  <div data-a="off"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></div>
</div>

<div class="hero"><h1 id="title"></h1><p id="desc"></p></div>
<div class="shelf">Your apps</div>
<div class="view"><div class="grid" id="grid"></div></div>
<div id="panel"><div class="ph">Inputs</div><div id="plist"></div></div>
<div class="note" id="note"></div>
<div id="saver">
  <div class="wall" id="swall"><div class="hello" id="shello"></div>
    <div class="names">Coco <b>&amp;</b><br>Genichi</div>
    <div class="clock" id="stime"></div><div class="day" id="sdate"></div></div>
  <div class="wx" id="swx"><span class="wxi" id="swxi"></span><span class="wxt" id="swxt"></span>
    <div class="wxc" id="swxc"></div><div class="wxr" id="swxr"></div></div>
  <div class="hint"><span>Press any button to open your apps</span></div>
</div></div>

<script>
// ES5 only: older Bravia web runtimes don't support modern JS.
(function () {
  document.documentElement.style.fontSize = (window.innerWidth / 1280 * 16) + "px";
})();

// Known services get their logo tile (img) or brand colors; anything else gets a neutral card.
// halo: the app's color (r,g,b), used for the focus ring. tag: the line under the title.
var BRANDS = {
  netflix:     { bg: "#000", fg: "#e50914", halo: "229,9,20", text: "NETFLIX", img: 1, tag: "Movies and series" },
  youtube:     { bg: "#fff", fg: "#ff0000", halo: "255,60,60", text: "YouTube", img: 1, tag: "Videos and live streams" },
  prime:       { bg: "#1a98ff", fg: "#fff", halo: "26,152,255", text: "prime video", img: 1, tag: "Prime Video originals and rentals" },
  roku:        { bg: "#6c1d7d", fg: "#fff", halo: "170,70,200", text: "Roku", img: 1, tag: "Your Roku home screen" },
  crunchyroll: { bg: "#f47521", fg: "#fff", halo: "244,117,33", text: "crunchyroll", img: 1, tag: "Anime, subbed and dubbed" },
  spotify:     { bg: "#121212", fg: "#1ed760", halo: "30,215,96", text: "Spotify", img: 1, tag: "Music and podcasts" },
  applemusic:  { bg: "#fa233b", fg: "#fff", halo: "250,35,59", text: "Apple Music", img: 1, tag: "Your library and radio" },
  appletv:     { bg: "#000", fg: "#fff", halo: "150,90,180", text: "Apple TV", img: 1, tag: "Apple TV+ and your purchases" },
  laptop:      { bg: "#1b1b1f", fg: "#fff", halo: "41,168,255", text: "Laptop", img: 1, tag: "Show your laptop on the TV" },
  screenmirroring: { bg: "#5b2a6e", fg: "#fff", halo: "150,90,180", text: "Mirror", img: 1, tag: "Win + K on your laptop" },
  hulu:        { bg: "#0b0c0f", fg: "#1ce783", halo: "28,231,131", text: "hulu" },
  disney:      { bg: "#0e1a5c", fg: "#fff", halo: "60,110,255", text: "Disney+" },
  plex:        { bg: "#1f1f1f", fg: "#e5a00d", halo: "229,160,13", text: "plex" }
};
var DESC = { input: "Switch the TV to this input", app: "Open on the TV", key: "Open on the TV", roku: "Open on your Roku" };

var COLS = 5, ROWH = 9.3, VISIBLE_ROWS = 2;
var tiles = [], sel = 0, inSide = false, sideSel = 0, shown = -1, scrolled = 0;
var apps = [], srcs = [], vis = [], inPanel = false, pSel = 0;  // apps: grid tiles; srcs: panel tiles; vis: srcs shown now
var live = null;  // {input uri: connected?} from /api/inputs; null = unknown (show everything)
var grid = document.getElementById("grid"), note = document.getElementById("note");
var panel = document.getElementById("panel"), plist = document.getElementById("plist");
var side = document.getElementById("side").getElementsByTagName("div");

function brand(name) {
  var k = name.toLowerCase().replace(/ /g, "");  // "Apple TV" -> "appletv"
  if (BRANDS[k]) { BRANDS[k].key = k; return BRANDS[k]; }
  for (var b in BRANDS) if (k.indexOf(b) === 0) { BRANDS[b].key = b; return BRANDS[b]; }
  return { bg: "#26262b", fg: "#fff", halo: "200,200,215", text: name };
}

function get(path, done) {
  var x = new XMLHttpRequest();
  x.open("GET", path, true);
  x.onreadystatechange = function () { if (x.readyState === 4 && done) done(x.status, x.responseText); };
  x.send();
}

// HDMI inputs (the Roku itself, a laptop) and tiles marked "panel" (screen mirroring)
function isSource(t) { return t.action === "input" || t.panel; }

// A source is listed if it's not an input, if we can't tell, or if its port has a device.
// The Roku is always listed: the TV only sees it as connected while it's awake.
function available(t) {
  if (t.action !== "input" || !live || !(t.value in live)) return true;
  return live[t.value] || brand(t.name).key === "roku";
}

function renderPanel() {
  plist.innerHTML = "";
  vis = [];
  for (var s = 0; s < srcs.length; s++) {
    var i = srcs[s], t = tiles[i];
    if (!available(t)) continue;
    vis.push(i);
    var b = brand(t.name), pi = document.createElement("div"), pt = document.createElement("div"),
        txt = document.createElement("div");
    pi.className = "pi";
    pt.className = "pt";
    pt.style.backgroundColor = b.bg;
    if (b.img) pt.style.backgroundImage = "url(/tile-" + b.key + ".png)";
    txt.innerHTML = "<b>" + t.name + "</b><span>" + (b.tag || t.label || DESC.input) + "</span>";
    pi.appendChild(pt);
    pi.appendChild(txt);
    plist.appendChild(pi);
  }
  pSel = Math.max(0, Math.min(pSel, vis.length - 1));  // stay on a real row if one vanished
  draw();
}

function refreshInputs() {
  get("/api/inputs", function (status, body) {
    var was = live ? JSON.stringify(live) : "";
    live = status === 200 ? JSON.parse(body) : null;
    if (inPanel && JSON.stringify(live || "") !== (was || '""')) renderPanel();
  });
}
setInterval(function () { if (inPanel) refreshInputs(); }, 5000);

function build() {
  for (var i = 0; i < tiles.length; i++) {
    var b = brand(tiles[i].name);
    if (isSource(tiles[i])) { srcs.push(i); continue; }
    apps.push(i);
    var c = document.createElement("div"), r = document.createElement("div"),
        t = document.createElement("div"), cap = document.createElement("div");
    c.className = "cell";
    r.className = "ring";
    r.style.backgroundColor = "rgb(" + b.halo + ")";
    t.className = "tile";
    t.style.backgroundColor = b.bg;
    t.style.color = b.fg;
    if (b.img) t.style.backgroundImage = "url(/tile-" + b.key + ".png)";
    else t.innerHTML = b.text;
    cap.className = "cap";
    cap.innerHTML = tiles[i].name;
    c.appendChild(r);
    c.appendChild(t);
    c.appendChild(cap);
    grid.appendChild(c);
  }
  draw();
}

function draw() {
  // Only touch what changed: the old and new focused cells, the sidebar, the hero, the scroll.
  var now = inSide || inPanel ? -1 : sel;
  if (now !== shown) {
    if (shown >= 0) grid.childNodes[shown].className = "cell";
    if (now >= 0) grid.childNodes[now].className = "cell on";
    shown = now;
  }
  for (var j = 0; j < side.length; j++) {
    var cls = (j === 0 ? "cur" : "") + (inSide && j === sideSel ? " on" : "");
    if (side[j].className !== cls) side[j].className = cls;
  }
  panel.className = inPanel ? "open" : "";
  var hero = document.getElementById("title").parentNode, hv = inPanel ? "hidden" : "visible";
  if (hero.style.visibility !== hv) hero.style.visibility = hv;  // long titles would peek past the panel
  for (var q = 0; q < plist.childNodes.length; q++) {
    var pc = "pi" + (inPanel && q === pSel ? " on" : "");
    if (plist.childNodes[q].className !== pc) plist.childNodes[q].className = pc;
  }
  if (!apps.length && !srcs.length) return;
  var t = inPanel && vis.length ? tiles[vis[pSel]] : tiles[apps[sel]], b = brand(t.name);
  document.getElementById("title").innerHTML = t.name;
  document.getElementById("desc").innerHTML = b.tag || t.label || DESC[t.action] || "";
  var r = Math.floor(sel / COLS), first = Math.max(0, r - VISIBLE_ROWS + 1);
  if (first !== scrolled) { scrolled = first; grid.style.top = (0.4 - first * ROWH) + "rem"; }
}

// Wallpapers (each has the scrims baked in); the choice is kept on the server.
var WALLPAPERS = { pastel: "/bg.jpg", cottage: "/bg-cottage.jpg" }, WALL_ORDER = ["cottage", "pastel"], wall = "cottage";

function setWallpaper(name, save) {
  if (!WALLPAPERS[name]) return;
  wall = name;
  document.body.style.backgroundImage = "url(" + WALLPAPERS[name] + ")";
  if (save) get("/api/prefs?wallpaper=" + name);
}

function launch() {
  if (inSide) {
    var a = side[sideSel].getAttribute("data-a");
    if (a === "wallpaper") {
      var next = WALL_ORDER[(WALL_ORDER.indexOf(wall) + 1) % WALL_ORDER.length];
      setWallpaper(next, true);
      return;
    }
    if (a === "menu") get("/api/key?name=Home");
    if (a === "off") get("/api/key?name=Power");
    return;
  }
  run(apps[sel]);
}

function run(i) {
  var name = tiles[i].name;
  note.innerHTML = "Opening " + name + "&hellip;";
  get("/api/tile?i=" + i, function (status) {
    note.innerHTML = status === 200 ? "" : "Couldn't open " + name;
  });
}

var SAVER_AFTER = 5 * 60000, lastKey = new Date().getTime(), saverOn = false, drift = 0;
// Small shifts each minute so nothing burns in (rem offsets from the base layout).
var DRIFT = [[0, 0]];  // text stays on its baked-in glass

new Image().src = "/saver.jpg";  // load it now so the screensaver appears without a blank flash
document.getElementById("saver").style.visibility = "hidden";  // laid out (fonts load) but not shown
document.getElementById("saver").className = "on";
setTimeout(function () {
  var v = document.getElementById("saver");
  v.style.visibility = "";
  if (!saverOn) v.className = "";  // unless it was opened meanwhile
}, 1500);

function showSaver(on) {
  saverOn = on;
  document.getElementById("saver").className = on ? "on" : "";
  if (on) { updateSaver(); refreshWeather(); }
}

function greeting(h) {
  return h >= 5 && h < 12 ? "Good morning," : h >= 12 && h < 17 ? "Good afternoon," :
         h >= 17 && h < 22 ? "Good evening," : "Good night,";
}

function updateSaver() {
  if (!saverOn) return;
  document.getElementById("stime").innerHTML = tick.clock || "";
  document.getElementById("sdate").innerHTML = tick.longDate || "";
  document.getElementById("shello").innerHTML = greeting(tick.hour || 0);
  var d = DRIFT[drift++ % DRIFT.length];
  var w = document.getElementById("swall"), x = document.getElementById("swx");
  w.style.marginLeft = d[0] + "rem"; w.style.marginTop = d[1] + "rem";
  x.style.marginRight = d[0] + "rem"; x.style.marginTop = d[1] + "rem";
}

// Weather icons, drawn in the leaf-green ink with a few colored accents.
var CLOUD = "M7.5 19h9.5a4 4 0 0 0 .4-7.98A5.5 5.5 0 0 0 7 10.6 4.2 4.2 0 0 0 7.5 19z";
var WX_ICONS = {
  sun:   '<circle cx="12" cy="12" r="4.5" fill="#ef9d3f" stroke="none"/><path stroke="#ef9d3f" d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
  moon:  '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#f4d58a" stroke="#c89a3e"/>',
  part:  '<circle cx="9" cy="8" r="3.6" fill="#ef9d3f" stroke="none"/><path stroke="#ef9d3f" d="M9 1.6v1.3M2.6 8h1.3M4.5 3.5l.9.9M13.5 3.5l-.9.9"/><path fill="#fdfbf7" d="' + CLOUD + '"/>',
  cloud: '<path fill="#fdfbf7" d="' + CLOUD + '"/>',
  fog:   '<path stroke="#7d8a84" d="M4 8h16M6 12h12M4 16h16"/>',
  rain:  '<path fill="#fdfbf7" transform="translate(0,-3)" d="' + CLOUD + '"/><path stroke="#5f84cc" d="M9 19l-1 2.5M13 19l-1 2.5M17 19l-1 2.5"/>',
  snow:  '<path fill="#fdfbf7" transform="translate(0,-3)" d="' + CLOUD + '"/><circle cx="9" cy="20" r="1" fill="#8fb3e6" stroke="none"/><circle cx="13" cy="21.5" r="1" fill="#8fb3e6" stroke="none"/><circle cx="17" cy="20" r="1" fill="#8fb3e6" stroke="none"/>',
  storm: '<path fill="#fdfbf7" transform="translate(0,-3)" d="' + CLOUD + '"/><path stroke="#e2952e" d="M13 16l-2.5 3.8h3L11.5 23"/>'
};

function wxKind(c, day) {
  if (c === 0) return day ? ["sun", "Clear and sunny"] : ["moon", "Clear"];
  if (c <= 2) return [day ? "part" : "cloud", "Partly cloudy"];
  if (c === 3) return ["cloud", "Cloudy"];
  if (c <= 48) return ["fog", "Foggy"];
  if (c <= 57) return ["rain", "Drizzle"];
  if (c <= 67) return ["rain", "Rain"];
  if (c <= 77) return ["snow", "Snow"];
  if (c <= 82) return ["rain", "Showers"];
  if (c <= 86) return ["snow", "Snow showers"];
  return ["storm", "Thunderstorms"];
}

function refreshWeather() {
  get("/api/weather", function (status, body) {
    if (status !== 200) return;  // keep the last reading
    var w = JSON.parse(body), kind = wxKind(w.code, w.day);
    document.getElementById("swxi").innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#23402f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + WX_ICONS[kind[0]] + "</svg>";
    document.getElementById("swxt").innerHTML = w.temp + "&deg;";
    document.getElementById("swxc").innerHTML = kind[1] + (w.place ? " in " + w.place : "");
    document.getElementById("swxr").innerHTML = w.high != null ? "High " + w.high + "&deg;, low " + w.low + "&deg;" : "";
    document.getElementById("swx").className = "wx ready";
  });
}

setInterval(function () {
  if (!saverOn && new Date().getTime() - lastKey > SAVER_AFTER) showSaver(true);
  else if (saverOn) updateSaver();
}, 60000);
setInterval(function () { if (saverOn) refreshWeather(); }, 15 * 60000);

document.onkeydown = function (e) {
  lastKey = new Date().getTime();
  if (saverOn) { showSaver(false); return false; }
  var k = e.keyCode, n = apps.length;
  if (inPanel) {
    if (k === 38) pSel = Math.max(0, pSel - 1);
    else if (k === 40) pSel = Math.min(vis.length - 1, pSel + 1);
    else if (k === 13) { if (vis.length) run(vis[pSel]); inPanel = false; }
    else if (k === 37 || k === 8 || k === 27 || k === 461) inPanel = false;
    else return true;
    draw();
    return false;
  }
  if (k === 13) {
    if (inSide && side[sideSel].getAttribute("data-a") === "inputs") {
      if (srcs.length) { inPanel = true; pSel = 0; renderPanel(); refreshInputs(); }
    } else launch();
    return false;
  }
  if (inSide) {
    if (k === 38) sideSel = Math.max(0, sideSel - 1);
    else if (k === 40) sideSel = Math.min(side.length - 1, sideSel + 1);
    else if (k === 39) inSide = false;
    else return true;
  } else {
    if (k === 37) { if (sel % COLS === 0) { inSide = true; sideSel = 0; } else sel--; }
    else if (k === 39) { if (sel % COLS < COLS - 1 && sel < n - 1) sel++; }
    else if (k === 38) { if (sel >= COLS) sel -= COLS; }
    else if (k === 40) {
      if (sel + COLS < n) sel += COLS;
      else if (Math.floor(sel / COLS) < Math.floor((n - 1) / COLS)) sel = n - 1;
    }
    else return true;
  }
  draw();
  return false;
};

// The TV's own clock and timezone are often wrong, so show the server's local time:
// keep the gap between the two clocks and read the result as UTC fields.
var clockShift = null;

function syncClock() {
  get("/api/time", function (status, body) {
    if (status !== 200) return;
    var t = JSON.parse(body);
    clockShift = t.epoch_ms - new Date().getTime() + t.utc_offset_min * 60000;
    tick();
  });
}

function tick() {
  if (clockShift === null) return;  // don't show the TV's wrong time while waiting
  var d = new Date(new Date().getTime() + clockShift), h = d.getUTCHours(), m = d.getUTCMinutes();
  var clock = (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM");
  tick.hour = h;
  tick.longDate = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()] + ", " +
    ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getUTCMonth()] + " " + d.getUTCDate();
  var date = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()] + ", " +
    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()] + " " + d.getUTCDate();
  // Only write when it changes: every write repaints the whole screen on this TV.
  if (clock !== tick.clock) {
    tick.clock = clock; document.getElementById("clock").innerHTML = clock;
    if (saverOn) document.getElementById("stime").innerHTML = clock;
  }
  if (date !== tick.date) { tick.date = date; document.getElementById("date").innerHTML = date; }
}
syncClock(); setInterval(tick, 5000); setInterval(syncClock, 10 * 60000);

// Open straight into the screensaver with /#saver (handy for a preview).
if (location.hash === "#saver") setTimeout(function () { showSaver(true); }, 800);

get("/api/prefs", function (status, body) {
  if (status === 200) setWallpaper(JSON.parse(body).wallpaper, false);
});

get("/api/tiles", function (status, body) {
  if (status === 200) { tiles = JSON.parse(body); build(); refreshInputs(); }
  else note.innerHTML = "Can't load tiles";
});
</script>
