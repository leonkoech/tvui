<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  /* Sized in rem; the script scales 1rem to the screen (16px at 1280 wide). */
  html, body { margin: 0; height: 100%; background: #0a0a0c; color: #fff; overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: none; }
  #bg { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    -webkit-transition: background-color .5s; transition: background-color .5s; }
  #shade { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(left, rgba(10,10,12,.96) 0%, rgba(10,10,12,.55) 60%, rgba(10,10,12,.25) 100%);
    background: linear-gradient(to right, rgba(10,10,12,.96) 0%, rgba(10,10,12,.55) 60%, rgba(10,10,12,.25) 100%); }
  #fade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: -webkit-linear-gradient(top, rgba(10,10,12,0), rgba(10,10,12,.95));
    background: linear-gradient(to bottom, rgba(10,10,12,0), rgba(10,10,12,.95)); }

  .top { position: absolute; left: 2.5rem; right: 2.5rem; top: 1.6rem; font-size: 1.1rem; }
  .top .date { float: right; color: rgba(255,255,255,.6); }

  .side { position: absolute; left: 1.6rem; top: 11rem; width: 2.6rem; }
  .side div { width: 2.6rem; height: 2.6rem; margin-bottom: 1.4rem; border-radius: .7rem;
    text-align: center; opacity: .55; }
  .side div.cur { opacity: 1; }
  .side div.cur:after { content: ""; display: block; width: 1.2rem; height: .16rem;
    margin: .25rem auto 0; background: #ff2d55; border-radius: .1rem; }
  .side div.on { opacity: 1; background: rgba(255,255,255,.18); }
  .side svg { width: 1.4rem; height: 1.4rem; margin-top: .6rem; }

  .hero { position: absolute; left: 6.5rem; top: 10rem; width: 34rem; }
  .hero h1 { margin: 0; font-size: 3.2rem; font-weight: 600; letter-spacing: -.05rem; }
  .hero p { margin: .7rem 0 1.4rem; font-size: 1.05rem; line-height: 1.5; color: rgba(255,255,255,.75); }
  .hero .btn { display: inline-block; padding: .6rem 1.3rem; border-radius: .4rem;
    background: #fff; color: #111; font-size: 1rem; font-weight: 600; }

  .row { position: absolute; left: 6.5rem; right: 0; bottom: 3.2rem; height: 8rem; white-space: nowrap; }
  .tile { display: inline-block; vertical-align: top; width: 13rem; height: 7.4rem; margin-right: 1.1rem;
    border-radius: .5rem; text-align: center; line-height: 7.4rem; font-size: 1.9rem; font-weight: 700;
    letter-spacing: -.03rem; border: .18rem solid transparent; box-sizing: border-box;
    -webkit-transition: -webkit-transform .15s; transition: transform .15s; }
  .tile.on { border-color: #fff; -webkit-transform: scale(1.07); transform: scale(1.07); }

  .note { position: absolute; left: 6.5rem; bottom: 1.2rem; font-size: .9rem; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="fade"></div>

<div class="top"><span id="clock"></span><span class="date" id="date"></span></div>

<div class="side" id="side">
  <div class="cur" data-a="home"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></div>
  <div data-a="menu"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg></div>
  <div data-a="off"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></div>
</div>

<div class="hero"><h1 id="title"></h1><p id="desc"></p><span class="btn">&#9654;&nbsp; Open</span></div>
<div class="row" id="row"></div>
<div class="note" id="note"></div>

<script>
// ES5 only: older Bravia web runtimes don't support modern JS.
(function () {
  document.documentElement.style.fontSize = (window.innerWidth / 1280 * 16) + "px";
})();

// Known services get brand colors; anything else gets a neutral card.
var BRANDS = {
  netflix: { bg: "#000", fg: "#e50914", glow: "#5a0a0e", text: "NETFLIX" },
  youtube: { bg: "#fff", fg: "#ff0000", glow: "#4a1010", text: "YouTube" },
  prime:   { bg: "#0f171e", fg: "#00a8e1", glow: "#0b3550", text: "prime video" },
  roku:    { bg: "#6c1d7d", fg: "#fff", glow: "#3d0f48", text: "Roku" },
  hulu:    { bg: "#0b0c0f", fg: "#1ce783", glow: "#0d4a2c", text: "hulu" },
  disney:  { bg: "#0e1a5c", fg: "#fff", glow: "#0e1a5c", text: "Disney+" },
  plex:    { bg: "#1f1f1f", fg: "#e5a00d", glow: "#4a3604", text: "plex" },
  max:     { bg: "#002be7", fg: "#fff", glow: "#001a8c", text: "max" }
};
var DESC = {
  input: "Switch the TV to this HDMI input.",
  app: "Open the app on the TV.",
  key: "Open the app on the TV."
};

var tiles = [], sel = 0, inSide = false, sideSel = 0;
var row = document.getElementById("row"), note = document.getElementById("note");
var side = document.getElementById("side").getElementsByTagName("div");

function brand(name) {
  var k = name.toLowerCase();
  for (var b in BRANDS) if (k.indexOf(b) >= 0) return BRANDS[b];
  return { bg: "#26262b", fg: "#fff", glow: "#222228", text: name };
}

function get(path, done) {
  var x = new XMLHttpRequest();
  x.open("GET", path, true);
  x.onreadystatechange = function () { if (x.readyState === 4 && done) done(x.status, x.responseText); };
  x.send();
}

function build() {
  for (var i = 0; i < tiles.length; i++) {
    var b = brand(tiles[i].name), t = document.createElement("div");
    t.className = "tile";
    t.style.background = b.bg;
    t.style.color = b.fg;
    t.innerHTML = b.text;
    row.appendChild(t);
  }
  draw();
}

function draw() {
  var n = row.childNodes;
  for (var i = 0; i < n.length; i++) n[i].className = "tile" + (!inSide && i === sel ? " on" : "");
  for (var j = 0; j < side.length; j++)
    side[j].className = (j === 0 ? "cur" : "") + (inSide && j === sideSel ? " on" : "");
  if (!tiles.length) return;
  var t = tiles[sel];
  document.getElementById("title").innerHTML = t.name;
  document.getElementById("desc").innerHTML = t.label || DESC[t.action] || "";
  document.getElementById("bg").style.backgroundColor = brand(t.name).glow;
}

function open() {
  if (inSide) {
    var a = side[sideSel].getAttribute("data-a");
    if (a === "menu") get("/api/key?name=Home");
    if (a === "off") get("/api/key?name=PowerOff");
    return;
  }
  var name = tiles[sel].name;
  note.innerHTML = "Opening " + name + "&hellip;";
  get("/api/tile?i=" + sel, function (status) {
    note.innerHTML = status === 200 ? "" : "Couldn't open " + name;
  });
}

document.onkeydown = function (e) {
  var k = e.keyCode, n = tiles.length;
  if (k === 13) { open(); return false; }
  if (inSide) {
    if (k === 38) sideSel = Math.max(0, sideSel - 1);
    else if (k === 40) sideSel = Math.min(side.length - 1, sideSel + 1);
    else if (k === 39) inSide = false;
    else return true;
  } else {
    if (k === 37) { if (sel === 0) { inSide = true; sideSel = 0; } else sel--; }
    else if (k === 39) sel = Math.min(n - 1, sel + 1);
    else if (k !== 38 && k !== 40) return true;
  }
  draw();
  return false;
};

function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById("clock").innerHTML =
    (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM");
  document.getElementById("date").innerHTML =
    ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()] + ", " +
    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + " " + d.getDate();
}
tick(); setInterval(tick, 10000);

get("/api/tiles", function (status, body) {
  if (status === 200) { tiles = JSON.parse(body); build(); }
  else note.innerHTML = "Can't load tiles";
});
</script>
</body>
</html>
