<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TV Remote">
<meta name="theme-color" content="#F8D3DF">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<title>TV Remote</title>
<style>
  @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url(/instrument-sans-500.woff2) format("woff2"), url(/instrument-sans-500.woff) format("woff"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url(/instrument-sans-600.woff2) format("woff2"), url(/instrument-sans-600.woff) format("woff"); }

  /* Palette from the app icon: pastel pink wash, sage D-pad, a pink flower for OK. */
  :root { --blush: #F8D3DF; --sage: #647C5C; --sage-dark: #4E6448; --rose: #DC6489; --sun: #F9D56E;
    --ink: #4E6448; --glass: rgba(255,255,255,.6); --shadow: rgba(78,100,72,.16); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; background: var(--blush); }
  body { margin: 0; min-height: 100vh; color: var(--ink);
    background: #f6d3de url(/remote-bg.jpg) center / cover no-repeat fixed;
    font-family: "Instrument Sans", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .wrap { max-width: 420px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-direction: column; gap: 26px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  button { border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer;
    display: grid; place-items: center; }
  /* Frosted-white pills with sage icons; the D-pad is the only saturated object. */
  .pill, .sq { background: var(--glass); border: 1px solid rgba(255,255,255,.7);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 5px 16px var(--shadow); transition: transform .12s, background .12s; }
  .pill { flex: 1; height: 64px; border-radius: 32px; }
  .sq { flex: 0 0 64px; height: 56px; border-radius: 10px; }
  /* No vibration on iOS, so the press itself has to read clearly. */
  .pill.hit, .sq.hit { transform: scale(.94); background: #fff; }
  svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round; }
  svg.fill { fill: var(--ink); stroke: none; }

  /* D-pad: sage cross on a frosted disc, one soft shadow like the icon */
  .disc { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 6px auto;
    border-radius: 50%; background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.55); }
  .cross { position: absolute; inset: 6%; }
  .shape { position: absolute; inset: 0; filter: drop-shadow(0 13px 19px rgba(160,80,110,.35)); }
  .arm { position: absolute; background: var(--sage); }
  .arm.v { left: 33%; width: 34%; top: 0; bottom: 0; border-radius: 22% / 12%; }
  .arm.h { top: 33%; height: 34%; left: 0; right: 0; border-radius: 12% / 22%; }
  .dir { position: absolute; background: transparent; width: 34%; height: 33%; border-radius: 18px; }
  .dir.hit { background: rgba(255,255,255,.14); }
  .dir.hit svg { stroke: var(--blush); }
  .dir svg { width: 34px; height: 34px; stroke: #fff; stroke-width: 2.8; }
  .up { left: 33%; top: 0; } .down { left: 33%; bottom: 0; }
  .left { top: 33%; left: 0; width: 33%; height: 34%; } .right { top: 33%; right: 0; width: 33%; height: 34%; }
  /* OK is the icon's flower: five pink petals and a yellow center. */
  .ok { position: absolute; left: 31%; top: 31%; width: 38%; height: 38%; background: transparent;
    transition: transform .12s; }
  .ok svg { width: 100%; height: 100%; stroke: none; }
  .ok.hit { transform: scale(.9) rotate(18deg); }

  /* Power: the one warm accent, findable but not tempting */
  .power { background: rgba(255,255,255,.7); }
  .power svg { stroke: var(--rose); }

  /* Device tabs: Auto routes for you; the others talk to one device directly. */
  .tabs { display: flex; gap: 6px; padding: 5px; border-radius: 24px; background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.7); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .tab { flex: 1; height: 38px; border-radius: 19px; background: transparent; font-size: 14px; font-weight: 600;
    color: var(--ink); opacity: .7; }
  .tab.on { background: #fff; opacity: 1; box-shadow: 0 2px 8px var(--shadow); }
  .main { display: flex; flex-direction: column; gap: 26px; }
  body.m-sound .main { display: none; }
  .extra { display: none; flex-direction: column; gap: 12px; }
  body.m-tv .x-tv, body.m-roku .x-roku, body.m-sound .x-sound { display: flex; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(78,100,72,.75);
    margin: 4px 4px -4px; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .chips.c3 { grid-template-columns: repeat(3, 1fr); }
  .chips.c2 { grid-template-columns: repeat(2, 1fr); }
  .chip { height: 48px; border-radius: 16px; background: var(--glass); border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 4px 12px var(--shadow); font-size: 14px; font-weight: 600; transition: transform .12s, background .12s; }
  .chip.hit { transform: scale(.94); background: #fff; }
  .chip.sel { background: var(--sage); color: #fff; border-color: var(--sage); }
  .kb { display: flex; gap: 10px; }
  .kb input { flex: 1; min-width: 0; height: 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,.8); padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--ink); background: rgba(255,255,255,.75); outline: none;
    -webkit-user-select: text; user-select: text; }
  .kb .chip { width: 72px; }
  .level { display: flex; align-items: center; gap: 10px; }
  .level .name { flex: 1; font-size: 15px; font-weight: 600; padding-left: 4px; }
  .level .val { width: 40px; text-align: center; font-size: 15px; font-weight: 600; }
  .level .chip { width: 56px; }
  .big { font-size: 34px; font-weight: 600; text-align: center; letter-spacing: -1px; padding: 8px 0; }
  .msg { text-align: center; font-size: 13px; color: rgba(78,100,72,.8); min-height: 16px; margin-top: -10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab" data-m="auto">Auto</button><button class="tab" data-m="tv">TV</button>
    <button class="tab" data-m="roku">Roku</button><button class="tab" data-m="sound">Soundbar</button>
  </div>

  <div class="main">
  <div class="row">
    <button class="pill" data-k="Return" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="sq" data-k="Home" aria-label="TV menu"><svg viewBox="0 0 24 24" style="stroke-width:1.6"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
    <button class="pill" data-home aria-label="Home screen"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5h-5.5v-5h-5v5H4z"/></svg></button>
  </div>

  <div class="disc">
    <div class="cross">
      <div class="shape"><div class="arm v"></div><div class="arm h"></div></div>
      <button class="dir up" data-k="Up" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="dir left" data-k="Left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ok" data-k="Confirm" aria-label="OK"><svg viewBox="-12 -12 24 24"><g fill="#DC6489"><circle cx="0" cy="-5.6" r="4.4"/><circle cx="5.33" cy="-1.73" r="4.4"/><circle cx="3.29" cy="4.53" r="4.4"/><circle cx="-3.29" cy="4.53" r="4.4"/><circle cx="-5.33" cy="-1.73" r="4.4"/></g><circle r="3.2" fill="#F9D56E"/></svg></button>
      <button class="dir right" data-k="Right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="dir down" data-k="Down" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>

  <div class="row">
    <button class="pill" data-k="VolumeDown" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="pill" data-k="Mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button class="pill" data-k="VolumeUp" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>

  <div class="row">
    <button class="pill" data-k="Rewind" aria-label="Rewind"><svg class="fill" viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg></button>
    <button class="pill" data-k="PlayPause" aria-label="Play or pause"><svg class="fill" viewBox="0 0 24 24"><path d="M3 5.5v13L12 12zM14 5.5h3v13h-3zM19 5.5h3v13h-3z"/></svg></button>
    <button class="pill" data-k="Forward" aria-label="Fast forward"><svg class="fill" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM13 6v12l8-6z"/></svg></button>
  </div>

  <div class="row">
    <button class="pill power" data-k="Power" aria-label="Power"><svg viewBox="0 0 24 24"><path d="M12 3.5v8M6.6 6.8a7.5 7.5 0 1 0 10.8 0"/></svg></button>
    <button class="pill" data-k="Options" aria-label="Options"><svg viewBox="0 0 24 24" style="stroke-width:2.8"><path d="M12 4v16M5.1 8l13.8 8M5.1 16l13.8-8"/></svg></button>
  </div>

  </div>

  <!-- TV: straight to the Sony -->
  <div class="extra x-tv">
    <div class="label">Inputs</div>
    <div class="chips">
      <button class="chip" data-d="tv" data-input="extInput:hdmi?port=1">HDMI 1</button>
      <button class="chip" data-d="tv" data-input="extInput:hdmi?port=2">HDMI 2</button>
      <button class="chip" data-d="tv" data-input="extInput:hdmi?port=3">HDMI 3</button>
      <button class="chip" data-d="tv" data-input="extInput:hdmi?port=4">HDMI 4</button>
    </div>
    <div class="label">Picture &amp; sound</div>
    <div class="chips">
      <button class="chip" data-d="tv" data-k="Display">Info</button>
      <button class="chip" data-d="tv" data-k="ClosedCaption">CC</button>
      <button class="chip" data-d="tv" data-k="Wide">Wide</button>
      <button class="chip" data-d="tv" data-k="Audio">Audio</button>
      <button class="chip" data-d="tv" data-k="SceneSelect">Scene</button>
      <button class="chip" data-d="tv" data-k="PicOff">Pic off</button>
      <button class="chip" data-d="tv" data-k="ChannelDown">CH −</button>
      <button class="chip" data-d="tv" data-k="ChannelUp">CH +</button>
    </div>
    <div class="label">Numbers</div>
    <div class="chips c3">
      <button class="chip" data-d="tv" data-k="Num1">1</button><button class="chip" data-d="tv" data-k="Num2">2</button><button class="chip" data-d="tv" data-k="Num3">3</button>
      <button class="chip" data-d="tv" data-k="Num4">4</button><button class="chip" data-d="tv" data-k="Num5">5</button><button class="chip" data-d="tv" data-k="Num6">6</button>
      <button class="chip" data-d="tv" data-k="Num7">7</button><button class="chip" data-d="tv" data-k="Num8">8</button><button class="chip" data-d="tv" data-k="Num9">9</button>
      <button class="chip" data-d="tv" data-k="DOT">·</button><button class="chip" data-d="tv" data-k="Num0">0</button><button class="chip" data-d="tv" data-k="Enter">Enter</button>
    </div>
  </div>

  <!-- Roku: straight to the Roku -->
  <div class="extra x-roku">
    <div class="label">Type on the Roku</div>
    <div class="kb">
      <input id="kbtext" type="text" placeholder="Search, password…" autocomplete="off" autocapitalize="off">
      <button class="chip" id="kbsend">Send</button>
    </div>
    <div class="chips">
      <button class="chip" data-d="roku" data-k="Backspace">⌫</button>
      <button class="chip" data-d="roku" data-k="Search">Search</button>
      <button class="chip" data-d="roku" data-k="InstantReplay">Replay</button>
      <button class="chip" data-d="roku" data-k="FindRemote">Find remote</button>
    </div>
  </div>

  <!-- Soundbar: straight to the Vizio -->
  <div class="extra x-sound">
    <div class="big" id="bvol">–</div>
    <div class="chips c2">
      <button class="chip" data-d="bar" data-k="PowerOn">On</button>
      <button class="chip" data-d="bar" data-k="PowerOff">Off</button>
    </div>
    <div class="chips c3">
      <button class="chip" data-d="bar" data-k="VolumeDown">−</button>
      <button class="chip" data-d="bar" data-k="Mute">Mute</button>
      <button class="chip" data-d="bar" data-k="VolumeUp">+</button>
    </div>
    <div class="label">Input</div>
    <div class="chips c3" id="binputs">
      <button class="chip" data-d="bar" data-k="input" data-v="Optical">Optical</button>
      <button class="chip" data-d="bar" data-k="input" data-v="Bluetooth">Bluetooth</button>
      <button class="chip" data-d="bar" data-k="input" data-v="USB">USB</button>
      <button class="chip" data-d="bar" data-k="input" data-v="AUX 1">AUX 1</button>
      <button class="chip" data-d="bar" data-k="input" data-v="AUX 2">AUX 2</button>
      <button class="chip" data-d="bar" data-k="input" data-v="Digital">Coaxial</button>
    </div>
    <div class="chips c2">
      <button class="chip" data-d="bar" data-k="btpair">Pair Bluetooth</button>
      <button class="chip" data-d="bar" data-k="input" data-v="Optical">Back to TV sound</button>
    </div>
    <div class="label">Sound</div>
    <div class="chips" id="bmodes">
      <button class="chip" data-d="bar" data-k="eq" data-v="Music">Music</button>
      <button class="chip" data-d="bar" data-k="eq" data-v="Movie">Movie</button>
      <button class="chip" data-d="bar" data-k="truvolume" id="btv">TruVolume</button>
      <button class="chip" data-d="bar" data-k="trusurround" id="bts">Surround</button>
    </div>
    <div class="level"><span class="name">Bass</span>
      <button class="chip" data-d="bar" data-k="bass" data-v="-1">−</button><span class="val" id="bbass">0</span>
      <button class="chip" data-d="bar" data-k="bass" data-v="1">+</button></div>
    <div class="level"><span class="name">Treble</span>
      <button class="chip" data-d="bar" data-k="treble" data-v="-1">−</button><span class="val" id="btreble">0</span>
      <button class="chip" data-d="bar" data-k="treble" data-v="1">+</button></div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
var msg = document.getElementById("msg"), mode = "auto", tvPaused = false;
try { mode = localStorage.getItem("tvui-mode") || "auto"; } catch (e) {}
var urlMode = /[?&]mode=(auto|tv|roku|sound)/.exec(location.search);  // e.g. /remote?mode=sound
if (urlMode) mode = urlMode[1];

// What each main button means on each device. Volume, mute and power keep their normal
// routing (soundbar volume, TV + soundbar power) in every tab.
var TV = { Return: "Return", Home: "Home", Up: "Up", Down: "Down", Left: "Left", Right: "Right",
  Confirm: "Confirm", Rewind: "Rewind", Forward: "Forward", Options: "Options" };
var ROKU = { Return: "Back", Home: "Home", Up: "Up", Down: "Down", Left: "Left", Right: "Right",
  Confirm: "Select", Rewind: "Rev", Forward: "Fwd", PlayPause: "Play", Options: "Info" };
var SHARED = { VolumeUp: 1, VolumeDown: 1, Mute: 1, Power: 1 };

function setMode(m) {
  mode = m;
  try { localStorage.setItem("tvui-mode", m); } catch (e) {}
  document.body.className = "m-" + m;
  document.querySelectorAll(".tab").forEach(function (t) { t.className = "tab" + (t.getAttribute("data-m") === m ? " on" : ""); });
  if (m === "sound") refreshBar();
}

function hit(btn) {
  if (navigator.vibrate) navigator.vibrate(8);
  btn.classList.add("hit");
  setTimeout(function () { btn.classList.remove("hit"); }, 160);
}

function send(path, btn, after) {
  if (btn) hit(btn);
  fetch(path).then(function (r) {
    return r.json().then(function (j) {
      var problem = r.ok ? j.warn : j.error;
      msg.textContent = !problem ? "" : /Roku blocks/.test(problem) ? problem : "The device didn't respond";
      if (after) setTimeout(after, 500);
    });
  }).catch(function () { msg.textContent = "Can't reach tvui. Is the server on?"; });
}

function mainKey(k, btn) {
  if (mode === "auto" || SHARED[k]) return send("/api/key?name=" + k, btn);
  if (mode === "tv") {
    if (k === "PlayPause") { k = tvPaused ? "Play" : "Pause"; tvPaused = !tvPaused; return send("/api/dev?d=tv&k=" + k, btn); }
    return send("/api/dev?d=tv&k=" + (TV[k] || k), btn);
  }
  if (mode === "roku") return send("/api/dev?d=roku&k=" + (ROKU[k] || k), btn);
}

function devKey(btn) {
  var d = btn.getAttribute("data-d"), q = "/api/dev?d=" + d;
  if (btn.hasAttribute("data-input")) q += "&input=" + encodeURIComponent(btn.getAttribute("data-input"));
  if (btn.hasAttribute("data-k")) q += "&k=" + btn.getAttribute("data-k");
  if (btn.hasAttribute("data-v")) q += "&v=" + encodeURIComponent(btn.getAttribute("data-v"));
  send(q, btn, d === "bar" ? refreshBar : null);
}

// Soundbar tab: show its current volume, input, mode and levels.
function refreshBar() {
  fetch("/api/bar").then(function (r) { return r.json(); }).then(function (b) {
    if (b.error) { document.getElementById("bvol").textContent = "Soundbar offline"; return; }
    document.getElementById("bvol").textContent = !b.on ? "Off" : b.mute === "On" ? "Muted" : "Volume " + b.volume;
    document.getElementById("bbass").textContent = b.bass;
    document.getElementById("btreble").textContent = b.treble;
    document.querySelectorAll("#binputs .chip").forEach(function (c) { c.classList.toggle("sel", c.getAttribute("data-v") === b.input); });
    document.querySelectorAll("#bmodes [data-k=eq]").forEach(function (c) { c.classList.toggle("sel", c.getAttribute("data-v") === b.eq); });
    document.getElementById("btv").classList.toggle("sel", b.truvolume === "On");
    document.getElementById("bts").classList.toggle("sel", b.trusurround === "On");
  }).catch(function () {});
}

document.querySelectorAll(".tab").forEach(function (t) {
  t.addEventListener("pointerdown", function (e) { e.preventDefault(); setMode(t.getAttribute("data-m")); });
});

document.querySelectorAll(".main button").forEach(function (b) {
  b.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (b.hasAttribute("data-home")) return send("/api/home", b);
    mainKey(b.getAttribute("data-k"), b);
  });
});

document.querySelectorAll(".extra [data-d]").forEach(function (b) {
  b.addEventListener("pointerdown", function (e) { e.preventDefault(); devKey(b); });
});

// Roku keyboard: sends the typed text as key presses.
function sendText() {
  var box = document.getElementById("kbtext");
  if (!box.value) return;
  send("/api/dev?d=roku&text=" + encodeURIComponent(box.value), document.getElementById("kbsend"));
  box.value = "";
}
document.getElementById("kbsend").addEventListener("pointerdown", function (e) { e.preventDefault(); sendText(); });
document.getElementById("kbtext").addEventListener("keydown", function (e) { if (e.key === "Enter") sendText(); });

setMode(mode);
</script>
</body>
</html>
